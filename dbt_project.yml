name: usage_revenue
version: "1.0.0"
config-version: 2
profile: usage_revenue

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Last day of actuals in the synthetic data. Everything after it is forecast.
  actuals_end: "2026-10-31"

models:
  usage_revenue:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    data_quality:
      +materialized: table
    reporting:
      +materialized: table
      +tags: ["post_ml"]
